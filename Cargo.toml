[package]
name = "krun"
version = "0.1.0"
edition = "2024"

[dependencies]
git2 = "0.21.0"
tempfile = "3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
which = "8.0.5"
dirs = "5.0"
anyhow = "1.0.104"
sha2 = "0.11.0"
hex = "0.4.3"
clap = { version = "4.6.4", features = ["derive"] }

[lib]
name = "lib"
path = "src/lib.rs"

[[bin]]
name = "krun"
path = "src/bin/krun.rs"

[[bin]]
name = "kr"
path = "src/bin/kr.rs"
